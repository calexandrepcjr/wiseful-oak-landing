name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and use OIDC for verification.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        # Verifies/initializes the Pages site and fails early with a clear message
        # if Pages isn't enabled with "GitHub Actions" as the source.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Temporary GitHub Pages project page lives under /wiseful-oak-landing/.
          # When the custom domain (wisefuloak.com) is wired up, remove this line
          # so the base path becomes "/".
          VITE_BASE_PATH: /wiseful-oak-landing/

      - name: Add SPA fallback
        # GitHub Pages serves 404.html for unknown paths while keeping the URL,
        # so BrowserRouter can boot and render deep links (e.g. /news/<slug>).
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
